services:
  - type: web
    name: forge-sales-api
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        fromDatabase:
          name: forge-sales-db
          property: connectionString
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: APP_LOGIN_PASSWORD
        sync: false

databases:
  - name: forge-sales-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "18"
    databaseName: forge_sales
    user: forge_sales
    diskSizeGB: 1
